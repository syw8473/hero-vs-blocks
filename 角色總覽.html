function drawSword(ctx, ox, oy, px, deg, elem, ghost){
  const B = BLADES[elem] || BLADES.slash, a = deg * Math.PI / 180, dx = Math.cos(a), dy = -Math.sin(a), nx = -dy, ny = dx, L = 14;
  const [ax, ay] = SWORD_PIVOT;
  const dot = (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(ox + Math.round(x) * px, oy + Math.round(y) * px, px, px); };
  const along = (t0, t1, off, col) => { for (let t = t0; t <= t1; t += .5) dot(ax + dx * t + nx * off, ay + dy * t + ny * off, col); };
  if (ghost) { ctx.globalAlpha = ghost; along(L * .4, L, 0, B.trail); along(L * .4, L, 1, B.trail); ctx.globalAlpha = 1; return; }   // swing trail
  if (B.glow) {   // elemental aura hugging the blade
    ctx.globalAlpha = .6;
    for (let t = 1.5; t <= L + 1.5; t += .5) {
      const f = elem === "fire" || elem === "thunder" ? Math.random() * 1.6 : 0;
      dot(ax + dx * t - nx * (2 + f), ay + dy * t - ny * (2 + f), B.glow); dot(ax + dx * t + nx * (3 + f), ay + dy * t + ny * (3 + f), B.glow);
    }
    ctx.globalAlpha = 1;
  }
  for (const [ox2, oy2] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) for (let t = 1.5; t <= L; t += .5) { dot(ax + dx * t + ox2, ay + dy * t + oy2, OUTLINE); dot(ax + dx * t + nx + ox2, ay + dy * t + ny + oy2, OUTLINE); }
  along(-2.5, -.5, 0, "#7a4a24");                                                     // hilt
  for (let k = -2; k <= 3; k++) dot(ax + dx * .8 + nx * k, ay + dy * .8 + ny * k, "#fcd83c");   // guard
  along(1.5, L, 0, B.core); along(1.5, L, 1, B.edge);                               // blade
}
function swingAngle(p){   // raise the sword up and back, cut down across toward the monster, hold, recover
  return p < .3 ? 90 + 45 * (p / .3) : p < .48 ? 135 - 190 * ((p - .3) / .18) : p < .75 ? -55 : -55 + 145 * ((p - .75) / .25);
}
// sword-qi crescent: a wide pixel arc around the sword hand — bright leading rim, element colour inside, tapered ends
const ARC_RX = 30, ARC_RY = 17, ARC_TH = 7;
function drawArc(ctx, cx, cy, px, fromDeg, toDeg, elem, alpha){
  const C = (BLADES[elem] || BLADES.slash).arc, a0 = fromDeg * Math.PI / 180, a1 = toDeg * Math.PI / 180;
  const steps = Math.max(2, Math.ceil(Math.abs(a0 - a1) * ARC_RX * 1.6)), seen = new Set();
  ctx.globalAlpha = alpha;
  for (let i = 0; i <= steps; i++) {
    const u = i / steps, a = a0 + (a1 - a0) * u, th = ARC_TH * Math.sin(Math.PI * Math.min(1, u * .85 + .1));
    for (let k = 0; k <= th; k += .5) {
      const x = Math.round(Math.cos(a) * (ARC_RX - k)), y = Math.round(-Math.sin(a) * (ARC_RY - k * ARC_RY / ARC_RX)), key = x + "," + y;
      if (seen.has(key)) continue; seen.add(key);
      ctx.fillStyle = k < 1 ? C[0] : k < th * .55 ? C[1] : C[2];
      ctx.fillRect(cx + x * px, cy + y * px, px, px);
    }
  }
  ctx.globalAlpha = 1;
}

function toHsl(hex){
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
